<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couplex — all photos</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0d12; color: #e6e9ef; font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; backdrop-filter: blur(8px); background: rgba(11,13,18,.85);
           border-bottom: 1px solid #1d2230; padding: 12px 18px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
  h1 span { color: #6b7a99; font-weight: 400; }
  input[type=search] { margin-left: auto; background: #141a26; border: 1px solid #232c3d; color: #e6e9ef;
           padding: 7px 11px; border-radius: 9px; outline: none; width: 220px; }
  input[type=search]:focus { border-color: #2563eb; }
  #count { color: #8a97ad; font-variant-numeric: tabular-nums; }
  main { padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  figure { margin: 0; position: relative; border-radius: 12px; overflow: hidden; background: #141a26; aspect-ratio: 1/1; }
  figure img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  figure figcaption { position: absolute; left: 8px; bottom: 8px; font-size: 11px; color: #cfd8e6;
           background: rgba(0,0,0,.55); padding: 2px 7px; border-radius: 20px; opacity: 0; transition: .15s; }
  figure:hover figcaption { opacity: 1; }
  #more { display: block; margin: 20px auto 40px; background: #1d2534; color: #e6e9ef; border: 1px solid #2b3548;
           padding: 10px 22px; border-radius: 10px; cursor: pointer; }
  #more:hover { border-color: #2563eb; }
  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; z-index: 9; }
  #viewer.on { display: flex; }
  #viewer img { max-width: 96vw; max-height: 92vh; border-radius: 8px; }
  #viewer a { position: absolute; top: 14px; right: 18px; color: #cfd8e6; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Couplex <span>— every photo in the set</span></h1>
  <span id="count">loading…</span>
  <input type="search" id="q" placeholder="filter by id (m001, e042, x1130)…">
</header>
<main><div class="grid" id="grid"></div><button id="more" hidden>show more</button></main>
<div id="viewer"><a id="raw" target="_blank" rel="noreferrer">open original</a><img alt=""></div>

<script>
const CDN = 'https://cdn.jsdelivr.net/gh/IamCaptainPepe/couplex@data/images/';
const IDX = 'https://raw.githubusercontent.com/IamCaptainPepe/couplex/data/images/index.json';
const PAGE = 120;
let all = [], shown = 0, filtered = [];

const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const moreBtn = document.getElementById('more');

function render(reset) {
  if (reset) { grid.innerHTML = ''; shown = 0; }
  const slice = filtered.slice(shown, shown + PAGE);
  const frag = document.createDocumentFragment();
  for (const it of slice) {
    const fig = document.createElement('figure');
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = CDN + it.n;
    img.alt = it.b;
    img.dataset.src = it.n;
    img.addEventListener('click', () => openViewer(it.n));
    const cap = document.createElement('figcaption');
    cap.textContent = it.b;
    fig.append(img, cap);
    frag.append(fig);
  }
  grid.append(frag);
  shown += slice.length;
  moreBtn.hidden = shown >= filtered.length;
  countEl.textContent = `${filtered.length} photos · showing ${shown}`;
}

function openViewer(name) {
  const v = document.getElementById('viewer');
  v.querySelector('img').src = CDN + name;
  document.getElementById('raw').href = CDN + name;
  v.classList.add('on');
}
document.getElementById('viewer').addEventListener('click', (e) => {
  if (e.target.tagName !== 'IMG' || e.target.closest('a')) e.currentTarget.classList.remove('on');
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.getElementById('viewer').classList.remove('on'); });

document.getElementById('q').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  filtered = all.filter(it => !q || it.b.includes(q));
  render(true);
});
moreBtn.addEventListener('click', () => render(false));

fetch(IDX, { cache: 'no-cache' })
  .then(r => r.json())
  .then(d => {
    const seen = new Set();
    all = d.images.filter(it => { const b = it.b || it.n; if (seen.has(b)) return false; seen.add(b); return true; })
                   .sort((a, b) => (a.b || a.n).localeCompare(b.b || b.n));
    filtered = all;
    render(true);
  })
  .catch(err => { countEl.textContent = 'failed to load index'; console.error(err); });
</script>
</body>
</html>
